[package]
name = "url-shortener"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.3"
dotenvy = "0.15.7"
eyre = "0.6.12"
serde = { version = "1.0.219", features = ["derive"] }
sqlx = { version = "0.8.3", features = ["macros", "postgres", "runtime-tokio-native-tls"] }
tokio = { version = "1.44.2", features = ["full"] }
url = "2.5.4"

